<div class="page-container" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; height: 100%; box-sizing: border-box;">
  
  <!-- Üst Araç Çubuğu -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid #334155;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <h2 style="margin: 0; font-size: 1.4rem; color: #f8fafc;">📑 Reçete Yönetimi</h2>
      <span id="recipe-count-badge" class="role-badge" style="background: #3b82f6;">0 Reçete</span>
    </div>

    <!-- Sıralama ve Yeni Reçete Butonları -->
    <div style="display: flex; gap: 0.8rem; align-items: center;">
      <label style="color: #94a3b8; font-size: 0.9rem;">Sırala:</label>
      <select id="recipe-sort-select" class="hmi-select" style="height: 38px; padding: 0 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
        <option value="name_asc">İsme Göre (A-Z)</option>
        <option value="name_desc">İsme Göre (Z-A)</option>
        <option value="createdAt_desc">Oluşturma (En Yeni)</option>
        <option value="createdAt_asc">Oluşturma (En Eski)</option>
        <option value="updatedAt_desc">Güncelleme (En Yeni)</option>
      </select>

      <button id="btn-new-recipe" class="btn btn-green" data-auth="admin" style="height: 38px; display: flex; align-items: center; gap: 0.4rem;">
        ➕ Yeni Reçete
      </button>
    </div>
  </div>

  <!-- Reçete Listesi Tablosu (Operatör Sayfası) -->
  <div style="flex: 1; background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow-y: auto;">
    <table class="alarm-table" style="width: 100%; text-align: left; border-collapse: collapse;">
      <thead>
        <tr style="background: #0f172a; border-bottom: 2px solid #334155;">
          <th style="padding: 12px 16px;">Reçete Adı</th>
          <th style="padding: 12px 16px;">Parametre Sayısı</th>
          <th style="padding: 12px 16px;">Oluşturma Tarihi</th>
          <th style="padding: 12px 16px;">Son Güncelleme</th>
          <th style="padding: 12px 16px; text-align: right;">İşlemler</th>
        </tr>
      </thead>
      <tbody id="recipe-table-body">
        <tr><td colspan="5" class="empty-alarm-msg">Yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- REÇETE DÜZENLEME VE DETAY MODALI -->
<div id="recipe-modal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
  <div style="background: #1e293b; width: 90%; max-width: 1100px; height: 85vh; border-radius: 10px; border: 1px solid #475569; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.7);">
    
    <!-- Modal Başlık -->
    <div style="padding: 1rem 1.5rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; gap: 1rem; align-items: center;">
        <h3 style="margin: 0; color: #f8fafc; font-size: 1.25rem;">Reçete Düzenle:</h3>
        <input id="modal-recipe-name-input" type="text" placeholder="Reçete Adı Girin" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 1rem; width: 280px;" />
      </div>
      <button id="btn-close-recipe-modal" class="btn btn-red" style="padding: 6px 14px; font-size: 1rem;">✕ Kapat</button>
    </div>

    <!-- Aksiyon Butonları Çubuğu -->
    <div style="padding: 0.8rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
      <div style="display: flex; gap: 0.6rem; align-items: center;">
        <!-- PLC'den Oku (Path adreslerini okuyup Canlı ve Val sütununa yazar) -->
        <button id="btn-recipe-read-plc" class="btn btn-blue" style="height: 38px; display: flex; align-items: center; gap: 0.4rem;">
          📥 PLC'den Oku
        </button>
        <!-- PLC'ye Yaz (Val değerlerini doğrudan PLC adreslerine yazar) -->
        <button id="btn-recipe-write-plc" class="btn btn-green" style="height: 38px; display: flex; align-items: center; gap: 0.4rem;">
          📤 PLC'ye Yaz
        </button>
        <!-- Yeni Parametre Ekle -->
        <button id="btn-recipe-add-row" class="btn" data-auth="admin" style="height: 38px; background: #475569; color: #fff;">
          ➕ Satır Ekle
        </button>
      </div>

      <!-- Kaydetme Seçenekleri -->
      <div style="display: flex; gap: 0.6rem; align-items: center;">
        <!-- Farklı Kaydet (Save As) -->
        <button id="btn-recipe-save-as" class="btn btn-blue" data-auth="admin" style="height: 38px; display: flex; align-items: center; gap: 0.4rem;">
          📄 Farklı Kaydet
        </button>
        <!-- Mevcut Dosyayı Kaydet -->
        <button id="btn-recipe-save-json" class="btn btn-green" data-auth="admin" style="height: 38px; display: flex; align-items: center; gap: 0.4rem;">
          💾 Kaydet
        </button>
      </div>
    </div>

    <!-- Parametre Listesi Tablosu -->
    <div style="flex: 1; overflow-y: auto; padding: 1rem 1.5rem;">
      <table class="alarm-table" style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="background: #0f172a; border-bottom: 2px solid #334155;">
            <th style="padding: 10px; width: 28%;">Parametre Adı (Name)</th>
            <th style="padding: 10px; width: 34%;">PLC Sembol Yolu (Path)</th>
            <th style="padding: 10px; width: 18%;">Dosya Değeri (Val)</th>
            <th style="padding: 10px; width: 12%; color: #38bdf8;">PLC Canlı Değer</th>
            <th style="padding: 10px; width: 8%; text-align: center;" data-auth="admin">Sil</th>
          </tr>
        </thead>
        <tbody id="recipe-items-body">
        </tbody>
      </table>
    </div>

  </div>
</div>
