
 <div class="grid-container">
  <div class="card" data-symbol="GVL_HMI.stDashboard.fSpeedActual" data-format="1">
    <h3>Motor Hızı</h3>
    <div class="metric"><span class="metric-value">--</span> <small>RPM</small></div>
  </div>

  <div class="card card-editable" 
       data-title="Hedef Motor Hızı" 
       data-symbol="GVL_HMI.stDashboard.fSpeedTarget" 
       data-min="0" data-max="3000" data-unit="RPM" data-format="1"
       data-auth="operator">
    <h3>Hedef Hız</h3>
    <div class="metric"><span class="metric-value">--</span> <small>RPM</small></div>
  </div>

  <div class="card" data-symbol="GVL_HMI.stDashboard.fTemperature" data-format="1">
    <h3>Fırın Sıcaklığı</h3>
    <div class="metric"><span class="metric-value">--</span> <small>°C</small></div>
  </div>

  <div class="card card-editable" 
       data-title="Hedef Sıcaklık" 
       data-symbol="GVL_HMI.stDashboard.fTemperatureTarget" 
       data-min="20" data-max="250" data-unit="°C" data-format="1"
       data-auth="technician">
    <h3>Hedef Sıcaklık</h3>
    <div class="metric"><span class="metric-value">--</span> <small>°C</small></div>
  </div>
  <!-- Global değişken: Hangi sayfaya giderseniz gidin canlı kalır -->
  <div class="card card-editable" 
      data-title="Hat Basıncı"
      data-symbol="GVL_HMI.stGlobal.fEmergencyPressure" 
      data-format="1">
    <h3>Hat Basıncı</h3>
    <div class="metric"><span class="metric-value">--</span> <small>Bar</small></div>
  </div>
  </div>

  <div class="page-action-bar">
   <button class="btn btn-green hmi-btn" data-symbol="GVL.bCmdStart" data-type="momentary" data-auth="operator" data-i18n="30">BAŞLAT</button>
   <button class="btn btn-red hmi-btn" data-symbol="GVL.bCmdStop" data-type="momentary" data-auth="operator" data-i18n="31">DURDUR</button>
   <button class="btn btn-blue hmi-btn" data-symbol="GVL.bCmdReset" data-type="momentary" data-auth="admin" data-i18n="32">HATA SIFIRLA</button>
   <button class="btn btn-gray hmi-btn" data-symbol="GVL_HMI.stDashboard.bRunning" data-type="toggle" data-feedback="GVL_HMI.stDashboard.bRunning" data-auth="technician" data-i18n="33">ManualStart</button>
  </div>
