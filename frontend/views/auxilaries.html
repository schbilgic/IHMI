<main class="grid-container">
  <div class="card" data-symbol="GVL_Aux.fHydraulicPressure" data-format="2">
    <h3>Hidrolik Basınç</h3>
    <div class="metric"><span class="metric-value">--</span> <small>Bar</small></div>
  </div>

  <div class="card" data-symbol="GVL_Aux.fPneumaticPressure" data-format="2">
    <h3>Pnömatik Hat Basıncı</h3>
    <div class="metric"><span class="metric-value">--</span> <small>Bar</small></div>
  </div>

  <div class="card" data-symbol="GVL_Aux.fCoolingWaterTemp" data-format="1">
    <h3>Soğutma Suyu Sıcaklığı</h3>
    <div class="metric"><span class="metric-value">--</span> <small>°C</small></div>
  </div>
</main>

<div class="page-action-bar">
  <button class="btn btn-gray hmi-btn" data-symbol="GVL_Aux.bHydraulicPumpToggle" data-type="toggle" data-auth="operator">HİDROLİK POMPA</button>
  <button class="btn btn-gray hmi-btn" data-symbol="GVL_Aux.bCoolingFanToggle" data-type="toggle" data-auth="operator">SOĞUTMA FANI</button>
  <button class="btn btn-gray hmi-btn" data-symbol="GVL_Aux.bLubricationManual" data-type="momentary" data-auth="technician">MANUEL YAĞLAMA</button>
</div>
